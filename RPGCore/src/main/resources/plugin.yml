name: RPGCore
version: 0.2.0
main: dev.jason.rpgcore.RPGCore
api-version: "1.21.4"
description: Classes, stats, leveling from custom mobs, and class checkpoints.
author: Jason
commands:
  rpg:
    description: RPGCore commands
    usage: /rpg help
  stats:
    description: Open your stats book
    usage: /stats
permissions:
  rpgcore.admin:
    description: Create classes, spawn mobs, place checkpoints, edit players.
    default: op
